name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
          rustup default 1.95.0
      - name: Record the projected tree id
        id: tree
        run: echo "id=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          CAPOBARA_TREE_ID: ${{ steps.tree.outputs.id }}
        run: cargo build --locked
      - name: Test
        env:
          CAPOBARA_TREE_ID: ${{ steps.tree.outputs.id }}
        run: cargo test --locked
      - name: Clippy
        env:
          CAPOBARA_TREE_ID: ${{ steps.tree.outputs.id }}
        run: cargo clippy --locked --all-targets -- -D warnings
